name: Daily mod update check

on:
  schedule:
    - cron: "0 14 * * *"   # every day at 14:00 UTC
  workflow_dispatch:        # "Run workflow" button for a manual check

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Thunderstore for newer mod versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/check_mods.py
